<?xml version="1.0" encoding="UTF-8"?>
<!-- NEON//QUEST v3 icon sprite. No outer width/height.
     Each symbol is 24×24, stroke=currentColor, fill=none, stroke-width 2,
     round caps/joins, cyberpunk-geometric. Use via:
     <svg class="ic" aria-hidden="true"><use href="assets/icons.svg#i-name"/></svg>
     External <use> works same-origin (GitHub Pages) and offline if sw.js
     precaches assets/icons.svg. 🔥 and 🔒 stay as emoji. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <!-- ◈ QUESTS tab -->
  <symbol id="i-quests" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
